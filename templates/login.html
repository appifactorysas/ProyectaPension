{% extends "base.html" %}
{% block titulo %}Acceso — ProyectaPension{% endblock %}
{% block contenido %}

<h1>Acceso restringido</h1>
<p class="lead">Esta herramienta procesa historias laborales con datos personales.</p>

<form class="tarjeta" method="post">
  <div class="campo">
    <label for="usuario">Usuario</label>
    <input type="text" id="usuario" name="usuario" autocomplete="username" autofocus required>
  </div>
  <div class="campo">
    <label for="clave">Contraseña</label>
    <input type="password" id="clave" name="clave" autocomplete="current-password" required>
  </div>
  <button type="submit">Entrar</button>
  <p style="text-align:center;margin-top:18px;font-size:13.5px">
    <a href="{{ url_for('olvide_clave') }}" style="color:var(--tenue)">¿Olvidaste tu contraseña?</a>
  </p>
</form>

{% endblock %}
