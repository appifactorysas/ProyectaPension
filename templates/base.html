<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}ProyectaPension{% endblock %}</title>
<style>
:root{
  --tinta:#16202e; --tinta-2:#45566b; --tenue:#8092a6;
  --linea:#dde2e9; --papel:#fbfaf8; --tarjeta:#fff; --crema:#f7f5f0;
  --oro:#9a7434; --verde:#1f6b4d; --rojo:#9b3226;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; background:var(--papel); color:var(--tinta);
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  font-size:16px; line-height:1.55;
}
.num{font-variant-numeric:tabular-nums}
.envoltura{max-width:760px; margin:0 auto; padding:56px 24px 72px}
.marca{font-size:12px; letter-spacing:.26em; text-transform:uppercase; color:var(--oro); font-weight:600}
.regla-oro{width:64px; height:3px; background:var(--oro); margin:14px 0 22px}
h1{font-size:38px; line-height:1.1; margin:0 0 10px; font-weight:600; letter-spacing:-.015em}
.lead{font-size:17px; color:var(--tinta-2); font-style:italic; margin:0 0 36px}
.tarjeta{background:var(--tarjeta); border:1px solid var(--linea); border-radius:3px; padding:32px}
label{display:block; font-size:11.5px; letter-spacing:.14em; text-transform:uppercase;
      color:var(--tenue); font-weight:600; margin-bottom:8px}
.campo{margin-bottom:26px}
input[type=text],input[type=password],input[type=date],select{
  width:100%; padding:12px 14px; font-size:16px; font-family:inherit;
  border:1px solid var(--linea); border-radius:3px; background:#fff; color:var(--tinta);
}
input:focus,select:focus{outline:none; border-color:var(--oro); box-shadow:0 0 0 3px rgba(154,116,52,.13)}
.ayuda{font-size:13.5px; color:var(--tenue); margin-top:7px; font-style:italic}
.zona{
  border:1.5px dashed var(--linea); border-radius:3px; background:var(--crema);
  padding:34px 24px; text-align:center; cursor:pointer; transition:.15s;
}
.zona:hover,.zona.sobre{border-color:var(--oro); background:#f3efe6}
.zona-tit{font-size:17px; font-weight:600; margin-bottom:5px}
.zona-sub{font-size:13.5px; color:var(--tenue)}
.zona.cargado{border-style:solid; border-color:var(--verde); background:#f4faf7}
.zona.cargado .zona-tit{color:var(--verde)}
button{
  width:100%; padding:15px; font-family:inherit; font-size:16px; font-weight:600;
  color:#fff; background:var(--tinta); border:none; border-radius:3px; cursor:pointer;
  letter-spacing:.02em; transition:.15s;
}
button:hover{background:#0d1622}
button:disabled{opacity:.55; cursor:progress}
.aviso{background:var(--crema); border-left:3px solid var(--oro); padding:16px 18px;
       font-size:14px; color:var(--tinta-2); margin-top:28px; line-height:1.5}
.error{background:#fdf3f2; border-left:3px solid var(--rojo); padding:16px 18px;
       font-size:14.5px; color:#7a2a20; margin-bottom:26px; border-radius:2px}
.fila{display:grid; grid-template-columns:1fr 1fr; gap:20px}
@media(max-width:560px){.fila{grid-template-columns:1fr}.envoltura{padding:36px 18px}h1{font-size:30px}}
a{color:var(--oro)}
.salir{margin-top:40px; font-size:13.5px; text-align:right}
</style>
</head>
<body>
<div class="envoltura">
  <div class="marca">Proyecta&nbsp;Pension</div>
  <div class="regla-oro"></div>
  {% with mensajes = get_flashed_messages() %}
    {% if mensajes %}{% for m in mensajes %}<div class="error">{{ m }}</div>{% endfor %}{% endif %}
  {% endwith %}
  {% block contenido %}{% endblock %}
  {% if session.get('autorizado') %}
    <p class="salir"><a href="{{ url_for('salir') }}">Cerrar sesión</a></p>
  {% endif %}
</div>
</body>
</html>
